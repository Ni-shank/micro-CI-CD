server:
  port: 8083

spring:
  application:
    name: booking-service

  datasource:
    url: jdbc:mysql://host.docker.internal:3306/bookingdb?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true

  data:
    web:
      pageable:
        serialization-mode: via_dto

  # =========================
  # KAFKA
  # =========================
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:tickethub-kafka:9092}

    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

      properties:
        max.block.ms: 1000
        spring.json.add.type.headers: false

  # =========================
  # OPEN FEIGN
  # =========================
  cloud:
    openfeign:
      client:
        config:

          default:
            connect-timeout: 3000
            read-timeout: 5000
            logger-level: basic

          payment-service:
            connect-timeout: 3000
            read-timeout: 15000
            logger-level: full

          event-service:
            connect-timeout: 2000
            read-timeout: 3000
            logger-level: full

# =========================
# EUREKA
# =========================
eureka:
  client:
    enabled: ${EUREKA_ENABLED:true}

    service-url:
      defaultZone: ${EUREKA_URL:http://service-registry-container:8761/eureka/}

    register-with-eureka: true
    fetch-registry: true

  instance:
    prefer-ip-address: true

# =========================
# SERVICE URLS
# =========================
services:

  event-service:
    url: ${EVENT_SERVICE_URL:http://ticket-hub-container:8080}

  payment-service:
    url: ${PAYMENT_SERVICE_URL:http://payment-service-container:8081}

# =========================
# RESILIENCE4J
# =========================
resilience4j:

  # -------------------------
  # CIRCUIT BREAKER
  # -------------------------
  circuitbreaker:
    instances:

      eventService:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 5
        minimum-number-of-calls: 5

        failure-rate-threshold: 50

        wait-duration-in-open-state: 10s

        permitted-number-of-calls-in-half-open-state: 3

        automatic-transition-from-open-to-half-open-enabled: true

      paymentService:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 5
        minimum-number-of-calls: 5

        failure-rate-threshold: 50

        wait-duration-in-open-state: 10s

        permitted-number-of-calls-in-half-open-state: 3

        automatic-transition-from-open-to-half-open-enabled: true

        ignore-exceptions:
          - com.tickethub.booking.exception.PaymentClientException

  # -------------------------
  # RETRY
  # -------------------------
  retry:
    instances:

      eventService:
        max-attempts: 3
        wait-duration: 1s

      paymentService:
        max-attempts: 3
        wait-duration: 1s

        ignore-exceptions:
          - com.tickethub.booking.exception.PaymentClientException

  # -------------------------
  # RATE LIMITER
  # -------------------------
  ratelimiter:
    instances:

      eventService:
        limit-for-period: 10
        limit-refresh-period: 1s
        timeout-duration: 0

      paymentService:
        limit-for-period: 10
        limit-refresh-period: 1s
        timeout-duration: 0

# =========================
# BOOKING CONFIGURATION
# =========================
booking:

  payment:
    enabled: true

  expiry:
    minutes: 10
    scan-ms: 60000

  reconcile:
    scan-ms: 15000

  kafka:
    enabled: ${BOOKING_KAFKA_ENABLED:true}
    topic: booking-events

  security:
    jwt-secret: ${JWT_SECRET}

# =========================
# SWAGGER
# =========================
springdoc:

  api-docs:
    path: /v3/api-docs
    enabled: true

  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    try-it-out-enabled: true

# =========================
# ACTUATOR
# =========================
management:

  endpoints:
    web:
      exposure:
        include: health,info,metrics

  endpoint:
    health:
      show-details: always

# =========================
# LOGGING
# =========================
logging:

  level:
    root: INFO
    com.tickethub.booking: DEBUG

    # Feign logging
    feign: DEBUG
    org.springframework.cloud.openfeign: DEBUG

  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"