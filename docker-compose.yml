
  services:

    # ============================================================
    # 1. SERVICE REGISTRY / EUREKA
    # ============================================================
    service-registry:
      build:
        context: ./service-registry
        dockerfile: Dockerfile

      image: service-registry:1.0
      container_name: service-registry-container

      ports:
        - "8761:8761"

      networks:
        - tickethub-network

      healthcheck:
        test: ["CMD", "curl", "-f", "http://localhost:8761/actuator/health"]
        interval: 10s
        timeout: 5s
        retries: 10


    # ============================================================
    # 2. KAFKA
    # ============================================================
    kafka:
      image: apache/kafka:3.7.0
      container_name: tickethub-kafka

      ports:
        - "9092:9092"

      environment:
        KAFKA_NODE_ID: 1
        KAFKA_PROCESS_ROLES: broker,controller
        KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
        KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
        KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
        KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
        KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
        KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
        KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
        KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
        KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

      networks:
        - tickethub-network


    # ============================================================
    # 3. MAILHOG
    # ============================================================
    mailhog:
      image: mailhog/mailhog:v1.0.1
      container_name: tickethub-mailhog

      ports:
        - "1025:1025"
        - "8025:8025"

      networks:
        - tickethub-network


    # ============================================================
    # 4. USER SERVICE
    # ============================================================
    user-service:
      build:
        context: ./user-service
        dockerfile: Dockerfile

      image: user-service:1.0
      container_name: user-service-container

      ports:
        - "8089:8089"

      environment:
        EUREKA_URL: http://service-registry:8761/eureka/
        EUREKA_INSTANCE_HOSTNAME: user-service

        DB_URL: "jdbc:mysql://host.docker.internal:3306/tickethub_user_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC"
        DB_USERNAME: ${DB_USERNAME}
        DB_PASSWORD: ${DB_PASSWORD}

        JWT_SECRET: ${JWT_SECRET}
        INITIAL_ADMIN_PASSWORD: ${INITIAL_ADMIN_PASSWORD}

      depends_on:
        service-registry:
          condition: service_started

      networks:
        - tickethub-network


    # ============================================================
    # 5. EVENT / TICKET-HUB SERVICE
    # ============================================================
    ticket-hub:
      build:
        context: ./ticket-hub
        dockerfile: Dockerfile

      image: ticket-hub:1.0
      container_name: ticket-hub-container

      ports:
        - "8080:8080"

      environment:
        EUREKA_URL: http://service-registry:8761/eureka/
        EUREKA_INSTANCE_HOSTNAME: ticket-hub

        DB_URL: "jdbc:mysql://host.docker.internal:3306/ticket_hub_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC"
        DB_USERNAME: ${DB_USERNAME}
        DB_PASSWORD: ${DB_PASSWORD}

      depends_on:
        service-registry:
          condition: service_started

      networks:
        - tickethub-network


    # ============================================================
    # 6. BOOKING SERVICE
    # ============================================================
    booking-service:
      build:
        context: ./booking-service
        dockerfile: Dockerfile

      image: booking-service:1.0
      container_name: booking-service-container

      ports:
        - "8083:8083"

      environment:
        EUREKA_URL: http://service-registry:8761/eureka/
        EUREKA_INSTANCE_HOSTNAME: booking-service

        DB_URL: "jdbc:mysql://host.docker.internal:3306/bookingdb?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC"
        DB_USERNAME: ${DB_USERNAME}
        DB_PASSWORD: ${DB_PASSWORD}

        KAFKA_BOOTSTRAP_SERVERS: kafka:9092
        JWT_SECRET: ${JWT_SECRET}

      depends_on:
        service-registry:
          condition: service_started
        kafka:
          condition: service_started

      networks:
        - tickethub-network


    # ============================================================
    # 7. PAYMENT SERVICE
    # ============================================================
    payment-service:
      build:
        context: ./payment-service
        dockerfile: Dockerfile

      image: payment-service:1.0
      container_name: payment-service-container

      ports:
        - "8081:8081"

      environment:
        EUREKA_URL: http://service-registry:8761/eureka/
        EUREKA_INSTANCE_HOSTNAME: payment-service

        DB_URL: "jdbc:mysql://host.docker.internal:3306/paymentdb?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC"
        DB_USERNAME: ${DB_USERNAME}
        DB_PASSWORD: ${DB_PASSWORD}

        KAFKA_BOOTSTRAP_SERVERS: kafka:9092

        PAYMENT_KEY_SECRET: ${PAYMENT_KEY_SECRET}
        PAYMENT_WEBHOOK_SECRET: ${PAYMENT_WEBHOOK_SECRET}

      depends_on:
        service-registry:
          condition: service_started
        kafka:
          condition: service_started

      networks:
        - tickethub-network


    # ============================================================
    # 8. NOTIFICATION SERVICE
    # ============================================================
    notification-service:
      build:
        context: ./notification-service
        dockerfile: Dockerfile

      image: notification-service:1.0
      container_name: notification-service-container

      ports:
        - "8085:8085"

      environment:
        EUREKA_URL: http://service-registry:8761/eureka/
        EUREKA_INSTANCE_HOSTNAME: notification-service

        DB_URL: "jdbc:mysql://host.docker.internal:3306/notificationdb?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC"
        DB_USERNAME: ${DB_USERNAME}
        DB_PASSWORD: ${DB_PASSWORD}

        KAFKA_BOOTSTRAP_SERVERS: kafka:9092

        MAIL_HOST: mailhog
        MAIL_PORT: 1025
        MAIL_SMTP_AUTH: "false"
        MAIL_STARTTLS: "false"

        MAIL_USERNAME: ${MAIL_USERNAME:-}
        MAIL_PASSWORD: ${MAIL_PASSWORD:-}
        NOTIFICATION_API_KEY: ${NOTIFICATION_API_KEY:-}

      depends_on:
        service-registry:
          condition: service_started
        kafka:
          condition: service_started
        mailhog:
          condition: service_started

      networks:
        - tickethub-network


    # ============================================================
    # 9. API GATEWAY
    # ============================================================
    api-gateway:
      build:
        context: ./api-gateway
        dockerfile: Dockerfile

      image: api-gateway:1.0
      container_name: api-gateway-container

      ports:
        - "8090:8090"

      environment:
        EUREKA_URL: http://service-registry:8761/eureka/
        EUREKA_INSTANCE_HOSTNAME: api-gateway

        USER_SERVICE_URI: http://user-service:8089
        BOOKING_SERVICE_URI: http://booking-service:8083
        EVENT_SERVICE_URI: http://ticket-hub:8080
        PAYMENT_SERVICE_URI: http://payment-service:8081
        NOTIFICATION_SERVICE_URI: http://notification-service:8085

        JWT_SECRET: ${JWT_SECRET}

      depends_on:
        service-registry:
          condition: service_started
        user-service:
          condition: service_started
        ticket-hub:
          condition: service_started
        booking-service:
          condition: service_started
        payment-service:
          condition: service_started
        notification-service:
          condition: service_started

      networks:
        - tickethub-network


  # ============================================================
  # NETWORK
  # ============================================================
  networks:
    tickethub-network:
      name: tickethub-network
      driver: bridge
