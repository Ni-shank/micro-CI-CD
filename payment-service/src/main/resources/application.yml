server:
  port: 8081

spring:
  application:
    name: payment-service

  # ============================================================
  # MySQL
  # ============================================================
  datasource:
    url: jdbc:mysql://host.docker.internal:3306/paymentdb?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect

  # ============================================================
  # Kafka
  # ============================================================
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:kafka:9092}

    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

      properties:
        max.block.ms: 5000
        reconnect.backoff.ms: 1000
        reconnect.backoff.max.ms: 10000
        spring.json.add.type.headers: false


# ============================================================
# Razorpay
# ============================================================
razorpay:
  key-id: rzp_test_TjhwUc1adtp2uX
  key-secret: ${PAYMENT_KEY_SECRET}
  webhook-secret: ${PAYMENT_WEBHOOK_SECRET}


payment:
  razorpay:
    key-id: rzp_test_TjhwUc1adtp2uX
    key-secret: ${PAYMENT_KEY_SECRET}
    webhook-secret: ${PAYMENT_WEBHOOK_SECRET}


# ============================================================
# TicketHub
# ============================================================
tickethub:
  kafka:
    enabled: true
    payment-topic: payment-events

  payment:
    gateway: ${PAYMENT_GATEWAY:razorpay}

    allowed-currencies:
      - INR

    razorpay:
      key-id: rzp_test_TjhwUc1adtp2uX
      key-secret: ${PAYMENT_KEY_SECRET}
      webhook-secret: ${PAYMENT_WEBHOOK_SECRET}
      manual-capture: false

    sync:
      enabled: true
      delay-ms: 60000
      min-age-seconds: 120
      max-age-minutes: 120


# ============================================================
# Eureka
# ============================================================
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://service-registry-container:8761/eureka/}

    register-with-eureka: true
    fetch-registry: true
    registry-fetch-interval-seconds: 5

  instance:
    hostname: payment-service-container
    prefer-ip-address: true


# ============================================================
# Actuator
# ============================================================
management:
  endpoints:
    web:
      exposure:
        include: health,info


# ============================================================
# Logging
# ============================================================
logging:
  level:
    com.tickethub: INFO
    org.apache.kafka: INFO
    org.springframework.kafka: INFO