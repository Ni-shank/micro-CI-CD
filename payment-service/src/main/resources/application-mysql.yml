# Used with: --spring.profiles.active=mysql

spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://host.docker.internal:3306/tickethub_payment?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver

  h2:
    console:
      enabled: false