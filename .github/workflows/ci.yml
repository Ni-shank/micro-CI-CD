
name: TicketHub CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  # Build and test the six services that don't need
  # the dedicated MySQL service configured below.
  build:
    name: Build and test - ${{ matrix.service }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        service:
          - api-gateway
          - booking-service
          - notification-service
          - payment-service
          - service-registry
          - user-service

    env:
      JWT_SECRET: ci-only-test-secret-for-github-actions-2026

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: '**/pom.xml'

      - name: Build and test service
        working-directory: ${{ matrix.service }}
        run: |
          if [ -f "./mvnw" ]; then
            chmod +x ./mvnw
            ./mvnw --batch-mode --no-transfer-progress verify
          else
            mvn --batch-mode --no-transfer-progress verify
          fi

  # Ticket Hub gets its own MySQL database for CI.
  ticket-hub-build:
    name: Build and test - ticket-hub
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ci-root-password
          MYSQL_DATABASE: ticket_hub_db
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pci-root-password"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      JWT_SECRET: ci-only-test-secret-for-github-actions-2026
      SPRING_DATASOURCE_URL: jdbc:mysql://127.0.0.1:3306/ticket_hub_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      DB_USERNAME: root
      DB_PASSWORD: ci-root-password
      EUREKA_URL: http://localhost:8761/eureka/
      EUREKA_CLIENT_REGISTER_WITH_EUREKA: 'false'
      EUREKA_CLIENT_FETCH_REGISTRY: 'false'

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: '**/pom.xml'

      - name: Build and test ticket-hub
        working-directory: ticket-hub
        run: |
          if [ -f "./mvnw" ]; then
            chmod +x ./mvnw
            ./mvnw --batch-mode --no-transfer-progress verify
          else
            mvn --batch-mode --no-transfer-progress verify
          fi