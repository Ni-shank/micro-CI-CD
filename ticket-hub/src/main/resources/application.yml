server:
  port: 8080

spring:
  application:
    name: ticket-hub-local

  datasource:
    url: jdbc:mysql://host.docker.internal:3306/ticket_hub_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
    show-sql: true

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://service-registry-container:8761/eureka/}
    register-with-eureka: true
    fetch-registry: true

  instance:
    hostname: ticket-hub-container
    prefer-ip-address: true

logging:
  level:
    org.flywaydb: DEBUG
    org.springframework.boot.autoconfigure.flyway: DEBUG